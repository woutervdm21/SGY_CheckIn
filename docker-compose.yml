services:
  sgy-checkin:
    build: .
    container_name: sgy-checkin
    ports:
      - "8080:8080"
    volumes:
      - sgy_checkin_data:/data
    environment:
      # The app uses this to decide which calendar day a check-in belongs to, and to
      # display check-in times. Defaults to South Africa time — change to your church's
      # IANA time zone name if different (see README).
      TZ: Africa/Johannesburg
      # Required: paste the hash generated by the --hash-password command (see README).
      # The app refuses every login while this is blank — fails closed, not open.
      CheckInAuth__PasswordHash: ""
    restart: unless-stopped

volumes:
  sgy_checkin_data:
