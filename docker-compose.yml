services:
  sgy-checkin:
    build: .
    container_name: sgy-checkin
    ports:
      - "8080:8080"
    volumes:
      - sgy_checkin_data:/data
    environment:
      # The app uses this to decide which calendar day a check-in belongs to, and to
      # display check-in times. Defaults to South Africa time — change to your church's
      # IANA time zone name if different (see README).
      TZ: Africa/Johannesburg
      # The admin password. Paste the hash from the --hash-password command (see README).
      # A blank hash disables admin login (fails closed). The volunteer password is not
      # set here: an admin sets it on the Settings page.
      CheckInAuth__AdminPasswordHash: ""
    restart: unless-stopped

volumes:
  sgy_checkin_data:
