services:
  sgy-checkin:
    build: .
    container_name: sgy-checkin
    ports:
      - "8080:8080"
    volumes:
      - sgy_checkin_data:/data
    environment:
      # The app uses this to decide which calendar day a check-in belongs to, and to
      # display check-in times. Defaults to South Africa time — change to your church's
      # IANA time zone name if different (see README).
      TZ: Africa/Johannesburg
      # The admin password. Paste the hash from the --hash-password command (see README).
      # A blank hash disables admin login (fails closed). The volunteer password is not
      # set here: an admin sets it on the Settings page.
      CheckInAuth__AdminPasswordHash: ""
      # Backups: a full copy of the database once a week, keeping the 12 newest, saved in
      # the data storage area (/data/backups). Manual and pre-restore copies count toward
      # the 12. To keep a longer history, uncomment and change these:
      # Backup__Keep: "12"
      # Backup__IntervalDays: "7"
      # To keep them in a folder on this computer instead (one that syncs to OneDrive,
      # say), add a line under volumes: like
      #   - C:/Users/Church/OneDrive/SG-Backups:/backups
      # and uncomment this:
      # Backup__Directory: /backups
    restart: unless-stopped

volumes:
  sgy_checkin_data:
