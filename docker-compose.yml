services:
  sgy-checkin:
    build: .
    container_name: sgy-checkin
    ports:
      - "8080:8080"
    volumes:
      - sgy_checkin_data:/data
    environment:
      # The app uses this to decide which calendar day a check-in belongs to, and to
      # display check-in times. Defaults to South Africa time — change to your church's
      # IANA time zone name if different (see README).
      TZ: Africa/Johannesburg
      # Two shared passwords, one per role. Paste the hashes from the --hash-password
      # command (see README). A blank hash disables that role's login (fails closed).
      # Volunteers can check in / register; admins can also manage youth profiles.
      CheckInAuth__VolunteerPasswordHash: ""
      CheckInAuth__AdminPasswordHash: ""
    restart: unless-stopped

volumes:
  sgy_checkin_data:
